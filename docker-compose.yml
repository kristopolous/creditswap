version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: creditswap-db
    environment:
      POSTGRES_USER: creditswap
      POSTGRES_PASSWORD: creditswap_dev
      POSTGRES_DB: creditswap
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creditswap -d creditswap"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
