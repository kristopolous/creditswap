services:
  postgres:
    image: postgres:16-alpine
    container_name: creditswap-db
    environment:
      POSTGRES_USER: creditswap
      POSTGRES_PASSWORD: creditswap_dev
      POSTGRES_DB: creditswap
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creditswap -d creditswap"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    container_name: creditswap-web
    network_mode: host
    volumes:
      - .:/app
    environment:
      PGHOST: localhost
      PGPORT: "5433"
      PGUSER: creditswap
      PGPASSWORD: creditswap_dev
      PGDATABASE: creditswap
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
